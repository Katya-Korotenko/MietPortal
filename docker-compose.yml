services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-rental_db}
      MYSQL_USER: ${DB_USER:-rental_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rental_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # Раз в неделю удаляет из БД просроченные JWT-токены
  # (таблицы blacklist_blacklistedtoken / blacklist_outstandingtoken)
  scheduler:
    build: .
    restart: unless-stopped
    command: >
      sh -c "while true; do
               python manage.py flushexpiredtokens;
               sleep 604800;
             done"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  static_volume:
